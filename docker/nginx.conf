# Ruch: Cloudflare → Caddy (projekt Offroadly, kompresja i TLS) → 127.0.0.1:8082 → ten nginx.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Przekierowania (np. /en → /en/) bez hosta i portu kontenera w nagłówku Location.
    absolute_redirect off;

    # Sprawdzane przez deploy.sh po każdym wdrożeniu.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nazwy CSS/JS nie mają skrótu wersji – krótki cache, żeby zmiany były widoczne szybko.
    location ~* \.(css|js)$ {
        expires 1h;
    }

    location ~* \.(svg|png|jpe?g|webp|avif|gif|ico|woff2?)$ {
        expires 7d;
    }
}
