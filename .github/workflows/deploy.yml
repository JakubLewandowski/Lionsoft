name: Build i deploy

# Push na main → obraz w GHCR → wdrożenie na serwer (mikr.us, wspólny z offroadly.pl i afiszownią).
# PR-y: tylko sprawdzenie, czy obraz się buduje (w tym `nginx -t`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# nowy push na tę samą gałąź anuluje starszy build; deploy na main nigdy nie jest przerywany w połowie
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jakublewandowski/lionsoft   # GHCR wymaga małych liter

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagi: latest + sha-<7 znaków> (tego szuka deploy.sh; po nim można też wrócić do konkretnej wersji).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Klucz SSH (sekret DEPLOY_SSH_KEY) może na serwerze uruchomić wyłącznie /opt/lionsoft/deploy/deploy.sh.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: beata212.mikrus.xyz
      DEPLOY_PORT: "10212"
      # Klucz hosta serwera (ssh-keyscan -p 10212 -t ed25519 beata212.mikrus.xyz) – chroni przed podszyciem się pod serwer.
      DEPLOY_HOST_KEY: "[beata212.mikrus.xyz]:10212 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEtk1IM5XKZOHgjV8cTZMkPy3m5mzkYFxMq/hm1iyPZP"
    steps:
      - name: Wdrożenie na serwer
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Brak sekretu DEPLOY_SSH_KEY – pomijam wdrożenie (patrz DEPLOY.md)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          # Jednorazowy GITHUB_TOKEN idzie na stdin – serwer pobiera nim prywatny obraz z GHCR i od razu się wylogowuje.
          printf '%s' "$GH_TOKEN" | ssh -i ~/.ssh/deploy -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "root@$DEPLOY_HOST" "deploy sha-${GITHUB_SHA::7} ${{ github.actor }}"
          rm -f ~/.ssh/deploy
